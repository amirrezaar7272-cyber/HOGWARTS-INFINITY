<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1422"><title>آزمون گروه‌بندی | Hogwarts Infinity</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0d1422;--panel:#17243a;--gold:#e8d39b;--cream:#f7f1e5;--muted:#c0c9d6;--red:#a8323e;--blue:#2863a5;--green:#267456;--yellow:#c99b2e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#a8323e22,transparent 30%),radial-gradient(circle at 85% 10%,#2863a522,transparent 30%),linear-gradient(145deg,#0b1220,#182238);color:var(--cream);font:16px/1.8 Vazirmatn,Arial,sans-serif}a{color:var(--gold);text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #ffffff22;padding-bottom:14px}.brand{font:bold 18px Georgia,serif;direction:ltr;letter-spacing:1px}.hero{text-align:center;padding:38px 10px 26px}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:12px}.hero h1{font-size:clamp(30px,6vw,48px);margin:8px}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.panel{background:linear-gradient(145deg,#20304a,#131e31);border:1px solid #ffffff24;border-radius:12px;padding:19px;box-shadow:0 12px 30px #0004}.card h2,.card h3{margin:4px 0 8px}.icon{font-size:32px}.btn,button{font:inherit;cursor:pointer}.btn{display:inline-block;background:linear-gradient(120deg,#f0d99b,#c99b2e);color:#1a2130;border:0;border-radius:8px;padding:10px 16px;font-weight:800}.btn.alt{background:#ffffff0d;border:1px solid #ffffff30;color:var(--cream)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.bar{height:12px;background:#ffffff18;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#8fd5a7);width:100%;transition:width .2s}.field{background:#0b1423;border:1px solid #ffffff30;color:white;border-radius:8px;padding:10px;font:inherit;width:100%}.notice{background:#ffffff0b;border:1px solid #d7bd7855;border-radius:9px;padding:12px;margin-top:15px;color:#e7dfcf;font-size:13px}.result{font-size:18px;color:var(--gold);font-weight:bold;margin-top:12px}.choice{display:block;width:100%;text-align:right;background:#0b1423;color:var(--cream);border:1px solid #ffffff25;border-radius:8px;padding:11px;margin:8px 0}.choice:hover,.choice:focus{border-color:var(--gold)}@media(max-width:600px){.hero{padding-top:25px}.wrap{padding-inline:13px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">HOGWARTS INFINITY</a><nav><a href="index.html">تالار اصلی</a> · <a href="wizard-profile.html">پروفایل</a> · <a href="dueling-arena.html">میدان نبرد</a></nav></header><section class="hero"><div class="eyebrow">THE SORTING HAT</div><h1>🎩 آزمون گروه‌بندی</h1><p class="muted">به ۸ پرسش پاسخ بده؛ کلاه گروه‌بندی گروه مناسب تو را پیشنهاد می‌کند.</p></section><section class="panel"><div class="bar"><i id="progress" style="width:0%"></i></div><p class="muted" id="step">پرسش ۱ از ۸</p><h2 id="question"></h2><div id="answers"></div><div class="result" id="result" aria-live="polite"></div><button class="btn" id="again" hidden>شروع دوباره</button></section></main><script>const qs=[['در یک ماجراجویی چه نقشی می‌گیری؟',[['رهبر شجاع','gry'],['طراح نقشه','sly'],['پژوهشگر','rav'],['حامی گروه','huf']] ],['کدام ارزش مهم‌تر است؟',[['شجاعت','gry'],['جاه‌طلبی','sly'],['خرد','rav'],['وفاداری','huf']] ],['یک قانون ناعادلانه می‌بینی؛ چه می‌کنی؟',[['با آن مقابله می‌کنم','gry'],['راه تغییرش را پیدا می‌کنم','sly'],['دلیلش را بررسی می‌کنم','rav'],['از آسیب‌دیدگان حمایت می‌کنم','huf']] ],['کدام درس را انتخاب می‌کنی؟',[['دفاع در برابر جادوی سیاه','gry'],['معجون‌سازی','sly'],['طلسم‌ها','rav'],['جانورشناسی','huf']] ],['دوستت به کمک نیاز دارد؛',[['فوراً وارد عمل می‌شوم','gry'],['بهترین راه‌حل را طراحی می‌کنم','sly'],['اطلاعات جمع می‌کنم','rav'],['کنارش می‌مانم','huf']] ],['کدام شیء را برمی‌داری؟',[['شمشیر شجاعت','gry'],['انگشتر اسرارآمیز','sly'],['کتاب باستانی','rav'],['قطب‌نمای دوستی','huf']] ],['در رقابت چه چیزی تو را جلو می‌برد؟',[['جرئت','gry'],['هدف','sly'],['ایده','rav'],['تلاش پیوسته','huf']] ],['کلاه باید چه چیزی را در تو ببیند؟',[['دلیر بودن','gry'],['اراده قوی','sly'],['ذهن خلاق','rav'],['قلب وفادار','huf']] ]];let i=0,s={gry:0,sly:0,rav:0,huf:0};const names={gry:'گریفیندور 🦁',sly:'اسلیترین 🐍',rav:'ریونکلا 🦅',huf:'هافلپاف 🦡'};function render(){document.getElementById('step').textContent='پرسش '+(i+1)+' از '+qs.length;document.getElementById('progress').style.width=(i/qs.length*100)+'%';document.getElementById('question').textContent=qs[i][0];document.getElementById('answers').innerHTML=qs[i][1].map(a=>'<button class="choice" data-h="'+a[1]+'">'+a[0]+'</button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{s[b.dataset.h]++;i++;if(i<qs.length)render();else finish()})}function finish(){const k=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];document.getElementById('progress').style.width='100%';document.getElementById('step').textContent='آزمون تمام شد';document.getElementById('question').textContent='کلاه گروه‌بندی تصمیم گرفت!';document.getElementById('answers').innerHTML='<div class="result">گروه پیشنهادی: '+names[k]+'</div><button class="btn" id="save">ثبت در پروفایل من</button>';document.getElementById('save').onclick=()=>{let p={};try{p=JSON.parse(localStorage.getItem('hogwartsWizardProfile')||'{}')}catch{}p.house=k;localStorage.setItem('hogwartsWizardProfile',JSON.stringify(p));document.getElementById('result').textContent='گروه در پروفایل همین دستگاه ذخیره شد.'};document.getElementById('again').hidden=false}document.getElementById('again').onclick=()=>location.reload();render();</script></body></html>
